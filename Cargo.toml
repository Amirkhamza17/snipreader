[package]
name = "snipreader"
version = "0.1.2"
edition = "2021"
description = "Grab text from anywhere on your Mac screen: select an area, get the text in your clipboard."
license = "MIT"
readme = "README.md"
keywords = ["ocr", "macos", "clipboard", "screenshot", "vision"]
categories = ["text-processing"]

[[bin]]
name = "snipreader"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
tray-icon = "0.19"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSString", "NSURL", "NSDictionary", "NSError", "NSObject", "NSProcessInfo", "NSIndexSet"] }
objc2-vision = { version = "0.2", features = ["VNRecognizeTextRequest", "VNDetectBarcodesRequest", "VNRequest", "VNRequestHandler", "VNObservation", "VNTypes"] }

[profile.release]
opt-level = 3
lto = "thin"        # optimise across crates: smaller, faster binary
codegen-units = 1
strip = true        # no debug symbols in the shipped app
